name: Build browser broker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['internal/browserbroker/**', 'cmd/browser-broker/**', 'Dockerfile.broker', '.github/workflows/browser-broker.yml']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    # A native ARM runner builds the arm64 image without emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.broker
          platforms: linux/arm64
          push: true
          tags: ghcr.io/nathanfredericks/browser-broker:sha-${{ github.sha }}
