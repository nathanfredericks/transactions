name: Build and inspect
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GOWORK: "off"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Go modules are tidy and fixed
        run: |
          go mod tidy -diff
          go fix -diff ./...
          cd cdk
          go mod tidy -diff
          go fix -diff ./...
      - name: Go vet and build
        run: |
          go vet ./...
          go build ./...
          cd cdk
          go vet ./...
          go build ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: golangci-lint (cdk)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: cdk
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          cd cdk
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: CDK synthesis
        run: |
          go build -C cdk -o ../dist/cdk-app .
          CDK_CONTEXT_JSON="$(python3 -c 'import json; print(json.dumps(json.load(open("cdk.json"))["context"]))')" CDK_OUTDIR=dist/cdk dist/cdk-app
