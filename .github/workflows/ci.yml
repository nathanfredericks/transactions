name: Build and inspect
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Go static checks and builds
        run: |
          test -z "$(gofmt -l cmd internal cdk/cdk.go)"
          go vet ./...
          go build ./...
          DYNAMODB_LOCAL=http://localhost:8000 go test ./...
          cd cdk
          go vet ./...
          go build ./...
      - name: CDK synthesis
        run: |
          go work init . ./cdk
          CDK_CONTEXT_JSON="$(python3 -c 'import json; print(json.dumps(json.load(open("cdk.json"))["context"]))')" CDK_OUTDIR=dist/cdk go run ./cdk
      - name: Admin checks
        run: |
          npm --prefix admin ci --ignore-scripts
          npm --prefix admin run lint
          npm --prefix admin run typecheck
          npm --prefix admin run build
