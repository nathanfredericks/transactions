version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # HTTP and context
    - bodyclose
    - noctx
    - contextcheck
    - containedctx
    # Errors
    - errorlint
    - nilerr
    - nilnil
    - errname
    # Logging and safety
    - sloglint
    - gosec
    - forcetypeassert
    - exhaustive
    - musttag
    # Simplicity
    - iface
    - unparam
    - gocognit
    - nestif
    - gocritic
    - revive
    # Modernization
    - modernize
    - exptostd
    - perfsprint
    - unconvert
    - misspell
    # Dependencies
    - depguard
    - gomoddirectives
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: use io and os
            - pkg: github.com/pkg/errors
              desc: use errors and fmt
            - pkg: golang.org/x/exp/slices
              desc: use slices
            - pkg: golang.org/x/exp/maps
              desc: use maps
        # Only the browser task signs in; the Lambdas, operator and the
        # packages they build on stay free of the browser stack.
        no-browser:
          files:
            - "**/cmd/lambda/**"
            - "**/cmd/operator/**"
            - "**/internal/engine/**"
            - "**/internal/bank/**"
            - "**/internal/banks/**"
            - "**/internal/state/**"
            - "**/internal/service/**"
            - "**/internal/config/**"
          deny:
            - pkg: github.com/nathanfredericks/transactions/internal/signin
              desc: only cmd/browser signs in
            - pkg: github.com/mxschmitt/playwright-go
              desc: browser code belongs in internal/signin
            - pkg: github.com/nathanfredericks/transactions/internal/chromium
              desc: only cmd/browser drives the browser
            - pkg: github.com/nathanfredericks/transactions/internal/human
              desc: only cmd/browser drives the browser
    gosec:
      excludes:
        - G104 # Duplicates errcheck.
        - G404 # math/rand only picks jitter and replay samples, never secrets.
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults:
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001 # De Morgan rewrites of "not (a and b)" guards read worse.

  exclusions:
    generated: lax
    presets:
      - comments # No doc comment required on every exported name.
      - std-error-handling # Unchecked Close, Remove, Setenv and print calls.
    rules:
      # Exclusions below are temporary. Each names the roadmap phase
      # (docs/audit/README.md) that deletes or rewrites the code; remove the
      # rule in that phase.




      # P5 replaces config globals and renames the typed failure.
      - path: ^internal/config/aws\.go$
        text: awsErr
        linters: [errname]
      - path: ^internal/bank/bank\.go$
        text: Failure
        linters: [errname]

      # Bank sign-ins and protocols are long, linear flows verified by live
      # sign-ins; splitting them would change what was verified.
      - path: ^(internal/banks|internal/bank|internal/signin|cmd/browser)/
        linters: [contextcheck, gocognit, gocritic, gosec, nestif]

      # P6 simplifies the broker.
      - path: ^internal/browserbroker/
        linters: [contextcheck, forcetypeassert, gocognit, gosec, noctx]
      - path: ^cmd/browser-broker/
        linters: [gocritic]

      # The offline replay harness and the learner belong to the learning
      # work (D12); no phase restructures them.
      - path: ^cmd/evaluate/
        linters: [errcheck, gocognit, gosec, musttag, nestif, noctx]
      - path: ^internal/learn/
        linters: [gocognit, nestif]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nathanfredericks/transactions
